name: Dataset Audit and Train Pipeline

on:
  workflow_dispatch:

jobs:
  audit-and-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || true
          pip install pillow torch torchvision || true

      - name: Dataset import (dry-run)
        run: |
          python backend/ml/training/import_datasets.py --manifest --out backend/ml/datasets || true

      - name: Dataset audit
        run: |
          python backend/ml/training/audit_dataset.py --dataset backend/ml/datasets --out backend/ml/datasets || exit 1

      - name: Train small smoke run (dry)
        run: |
          python backend/ml/training/train_pipeline_large.py --data backend/ml/datasets --epochs 1 --batch-size 8 --dry-run || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dataset-audit
          path: backend/ml/datasets/DATASET_AUDIT_REPORT.md
