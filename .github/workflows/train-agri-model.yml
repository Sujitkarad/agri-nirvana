name: Train Agri Nirvana Disease Model

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub Actions runner label (use a CUDA-capable runner for V2-L training)"
        required: false
        default: "ubuntu-latest"
      epochs:
        description: "Training epochs"
        required: false
        default: "100"
      batch_size:
        description: "Training batch size (reduce if GPU memory is limited)"
        required: false
        default: "8"
      learning_rate:
        description: "Initial classifier learning rate"
        required: false
        default: "0.000075"

jobs:
  train:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision
          pip install --no-cache-dir pillow numpy scikit-learn datasets huggingface_hub
          pip install --no-cache-dir -r backend/requirements.txt
      - name: Verify ML environment
        run: |
          python - <<'PY'
          import torch, torchvision
          print('PyTorch:', torch.__version__)
          print('TorchVision:', torchvision.__version__)
          print('CUDA available:', torch.cuda.is_available())
          if torch.cuda.is_available():
              print('CUDA device:', torch.cuda.get_device_name(0))
          print('Architecture: EfficientNetV2-L / 448x448')
          PY
      - name: Materialize public training and evaluation datasets
        run: |
          python -m backend.ml.training.import_datasets --output backend/ml/datasets --plantvillage --plantdoc --farmer-field
      - name: Verify PlantDoc dataset
        run: |
          python -m backend.ml.training.audit_dataset --data backend/ml/datasets/plantdoc --min-per-class 5
      - name: Verify PlantVillage training dataset
        run: |
          python -m backend.ml.training.audit_dataset --data backend/ml/datasets/plant_disease --min-per-class 5
      - name: Verify expert field and OOD datasets
        run: |
          test -d backend/ml/datasets/field_ood/field
          test -d backend/ml/datasets/field_ood/ood
          FIELD_COUNT="$(find backend/ml/datasets/field_ood/field -type f | wc -l)"
          OOD_COUNT="$(find backend/ml/datasets/field_ood/ood -type f | wc -l)"
          echo "Field images: ${FIELD_COUNT}"
          echo "OOD images: ${OOD_COUNT}"
          test "${FIELD_COUNT}" -gt 0
          test "${OOD_COUNT}" -gt 0
      - name: Train maximum-capacity EfficientNetV2-L
        run: |
          python -m backend.ml.training.train_pipeline_large --data backend/ml/datasets/plant_disease --output backend/ml/models/weights/agri_nirvana_efficientnet_v2_l.pt --epochs ${{ inputs.epochs }} --batch-size ${{ inputs.batch_size }} --lr ${{ inputs.learning_rate }} --image-size 448 --warmup-epochs 8 --freeze-epochs 8 --patience 15 --workers 2
      - name: Verify trained checkpoint and benchmark quality
        run: |
          test -s backend/ml/models/weights/agri_nirvana_efficientnet_v2_l.pt
          test -s backend/ml/models/weights/agri_nirvana_efficientnet_v2_l.json
          test -s backend/ml/training/training_report.json
          python - <<'PY'
          import json
          p='backend/ml/models/weights/agri_nirvana_efficientnet_v2_l.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d.get('architecture') == 'efficientnet_v2_l'
          assert int(d.get('image_size', 0)) == 448
          metrics=d.get('metrics', {})
          macro_f1=float(metrics.get('macro_f1', 0.0))
          ece=float(metrics.get('expected_calibration_error', 1.0))
          assert macro_f1 >= 0.70, f'Macro-F1 quality gate failed: {macro_f1:.4f} < 0.70'
          assert ece <= 0.15, f'Calibration quality gate failed: ECE {ece:.4f} > 0.15'
          print(json.dumps(metrics, indent=2))
          PY
      - name: Evaluate field and OOD data
        run: |
          python -m backend.ml.training.evaluate_field_ood --checkpoint backend/ml/models/weights/agri_nirvana_efficientnet_v2_l.pt --field-data backend/ml/datasets/field_ood/field --ood-data backend/ml/datasets/field_ood/ood --output backend/ml/training/field_ood_evaluation.json
      - name: Upload trained model, manifests and evaluation
        uses: actions/upload-artifact@v4
        with:
          name: agri-nirvana-efficientnet-v2-l
          path: |
            backend/ml/models/weights/agri_nirvana_efficientnet_v2_l.pt
            backend/ml/models/weights/agri_nirvana_efficientnet_v2_l.json
            backend/ml/training/training_report.json
            backend/ml/training/field_ood_evaluation.json
            backend/ml/datasets/dataset_manifest.json
            backend/ml/datasets/field_ood/manifest.json
          retention-days: 30
