name: Train Agri Nirvana Disease Model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        required: false
        default: "15"
      batch_size:
        description: Batch size
        required: false
        default: "32"
      learning_rate:
        description: Learning rate
        required: false
        default: "0.0003"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pillow numpy scikit-learn datasets huggingface_hub
          pip install -r backend/requirements.txt

      - name: Download PlantVillage
        run: |
          python -m backend.ml.training.download_plantvillage \
            --output backend/ml/datasets/plant_disease

      - name: Train EfficientNet-B0
        run: |
          python -m backend.ml.training.train_pipeline \
            --data backend/ml/datasets/plant_disease \
            --epochs ${{ inputs.epochs }} \
            --batch-size ${{ inputs.batch_size }} \
            --lr ${{ inputs.learning_rate }} \
            --split

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: agri-nirvana-efficientnet-b0
          path: |
            backend/ml/models/weights/agri_nirvana_efficientnet_b0.pt
            backend/ml/models/weights/agri_nirvana_efficientnet_b0.json
          retention-days: 30

      - name: Print evaluation
        run: |
          cat backend/ml/models/weights/agri_nirvana_efficientnet_b0.json
