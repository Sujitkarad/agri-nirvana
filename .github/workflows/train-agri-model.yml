name: Train Agri Nirvana Disease Model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs"
        required: false
        default: "80"
      batch_size:
        description: "Batch size"
        required: false
        default: "16"
      learning_rate:
        description: "Initial classifier learning rate"
        required: false
        default: "0.0001"
      max_per_class:
        description: "Maximum images per class (0 = complete dataset)"
        required: false
        default: "0"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir pillow numpy scikit-learn datasets huggingface_hub
          pip install --no-cache-dir -r backend/requirements.txt
      - name: Verify ML environment
        run: |
          python - <<'PY'
          import torch, torchvision
          print('PyTorch:', torch.__version__)
          print('TorchVision:', torchvision.__version__)
          print('CUDA available:', torch.cuda.is_available())
          print('Architecture: EfficientNetV2-S / 384x384')
          PY
      - name: Import PlantDoc field-condition evaluation dataset
        run: |
          python -m backend.ml.training.import_datasets \
            --output backend/ml/datasets \
            --plantdoc
      - name: Verify PlantDoc dataset
        run: |
          python -m backend.ml.training.audit_dataset \
            --data backend/ml/datasets/plantdoc \
            --min-per-class 5
      - name: Download PlantVillage
        run: |
          rm -rf backend/ml/datasets/plant_disease
          python -m backend.ml.training.download_plantvillage \
            --output backend/ml/datasets/plant_disease \
            --max-per-class ${{ inputs.max_per_class }}
      - name: Verify PlantVillage dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('backend/ml/datasets/plant_disease')
          total = 0
          for split in ('train', 'val', 'test'):
              classes = [p for p in (root / split).iterdir() if p.is_dir()]
              images = sum(1 for p in (root / split).rglob('*') if p.suffix.lower() in {'.jpg','.jpeg','.png','.webp','.bmp'})
              total += images
              print(f'{split}: {images} images, {len(classes)} classes')
          if total == 0:
              raise SystemExit('Dataset is empty')
          PY
      - name: Audit PlantVillage leakage and support
        run: |
          python -m backend.ml.training.audit_dataset \
            --data backend/ml/datasets/plant_disease \
            --min-per-class 5
      - name: Train EfficientNetV2-S
        run: |
          python -m backend.ml.training.train_pipeline \
            --data backend/ml/datasets/plant_disease \
            --epochs ${{ inputs.epochs }} \
            --batch-size ${{ inputs.batch_size }} \
            --lr ${{ inputs.learning_rate }} \
            --image-size 384 \
            --warmup-epochs 5 \
            --freeze-epochs 5 \
            --patience 12 \
            --workers 2
      - name: Verify trained checkpoint and quality
        run: |
          test -s backend/ml/models/weights/agri_nirvana_efficientnet_v2_s.pt
          test -s backend/ml/models/weights/agri_nirvana_efficientnet_v2_s.json
          test -s backend/ml/training/training_report.json
          python - <<'PY'
          import json
          p='backend/ml/models/weights/agri_nirvana_efficientnet_v2_s.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d.get('architecture') == 'efficientnet_v2_s', d.get('architecture')
          assert int(d.get('image_size', 0)) == 384, d.get('image_size')
          metrics=d.get('metrics', {})
          macro_f1=float(metrics.get('macro_f1', 0.0))
          ece=float(metrics.get('expected_calibration_error', 1.0))
          assert macro_f1 >= 0.70, f'Macro-F1 quality gate failed: {macro_f1:.4f} < 0.70'
          assert ece <= 0.15, f'Calibration quality gate failed: ECE {ece:.4f} > 0.15'
          print('Architecture:', d.get('architecture'))
          print('Image size:', d.get('image_size'))
          print('Classes:', d.get('num_classes'))
          print('Best epoch:', d.get('best_epoch'))
          print('Macro-F1:', macro_f1)
          print('ECE:', ece)
          print(json.dumps(metrics, indent=2))
          print(json.dumps(d.get('calibration', {}), indent=2))
          PY
      - name: Upload trained model and dataset manifest
        uses: actions/upload-artifact@v4
        with:
          name: agri-nirvana-efficientnet-v2-s
          path: |
            backend/ml/models/weights/agri_nirvana_efficientnet_v2_s.pt
            backend/ml/models/weights/agri_nirvana_efficientnet_v2_s.json
            backend/ml/models/weights/temperature_calibration.json
            backend/ml/training/training_report.json
            backend/ml/datasets/dataset_manifest.json
          retention-days: 30
