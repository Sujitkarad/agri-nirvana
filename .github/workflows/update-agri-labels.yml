name: Update Agri Nirvana Labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rename hero workflow labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/App.jsx")
          text = path.read_text(encoding="utf-8")
          old = "Build. Think. Discover."
          new = "Scan. Diagnose. Grow."
          if old in text:
              path.write_text(text.replace(old, new), encoding="utf-8")
          else:
              raise SystemExit("Expected hero label was not found in src/App.jsx")
          PY

      - name: Verify old label is gone
        shell: bash
        run: |
          ! grep -Fq 'Build. Think. Discover.' src/App.jsx
          grep -Fq 'Scan. Diagnose. Grow.' src/App.jsx

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git rm .github/workflows/update-agri-labels.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Update Agri Nirvana workflow labels"
          git push
